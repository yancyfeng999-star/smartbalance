name: Feature request
description: 提议一个可验证的产品或开发改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁遇到什么问题，当前如何处理。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户动作、可见结果和失败处理。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 数据与隐私影响
      description: 是否涉及网络、权限、Keychain、备份、迁移或第三方服务。
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我没有在描述中粘贴凭据、私密日志或用户数据。
          required: true
        - label: 我已阅读 README 和现有用户指南。
          required: true

